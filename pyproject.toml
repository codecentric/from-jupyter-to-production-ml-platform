[project]
name = "titanicsurvivors"
version = "0.1.0"
description = "Example project for the creation of a machine learning platform with ZenML.This project creates a model to predict would survive the titanic disaster."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "pyarrow>=21.0.0",
    "python-dotenv>=1.1.1",
    "secure>=0.3.0",
    "xgboost>=3.0.5",
    "zenml[connectors-gcp]==0.96.4",
    # ZenML 0.96.4 requires this compatible OpenTelemetry API/SDK set; without pins, newer API versions can make ZenML's artifact log exporter abstract and crash Vertex workers.
    "opentelemetry-api==1.43.0",
    "opentelemetry-sdk==1.43.0",
    "opentelemetry-semantic-conventions==0.64b0",
    "opentelemetry-instrumentation-logging==0.64b0",
]

[project.optional-dependencies]
gcp = [
    "gcsfs>=2024.12.0,<=2024.12.0,!=2025.5.0,!=2025.5.0.post1",
    "google-cloud-aiplatform>=1.165.1",
    "google-cloud-artifact-registry>=1.19.0",
    "google-cloud-build>=3.39.0",
    "google-cloud-container>=2.66.0",
    "google-cloud-logging>=3.16.3",
    "google-cloud-pipeline-components>=2.22.0",
    "google-cloud-run>=0.16.1",
    "google-cloud-secret-manager>=2.30.0",
    "google-cloud-storage>=3.4.1",
    "kfp>=2.6.0",
    "urllib3<2.6.0",
]
mlflow = [
    "mlflow>=3.3.2",
    "pydantic>=2.11.9",
    "python-rapidjson>=1.20",
]

[tool.uv]
package = true
